<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        body {
            background: hsl(0, 0%, 10%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .parent {
            border: 2px solid white;
            /* height: 500px; */
            width: 50vw;
            border-radius: 15px;
            display: flex;
            padding: 20px;
            /* flex-direction: column-reverse; */
            flex-wrap: wrap;
            /* column-gap: 30px; */
            row-gap: 30px;
        }

        .box {
            height: 200px;
            width: 200px;
            border: 2px solid white;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
